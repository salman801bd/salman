<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MyTube</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    color:#111;
}

/* ================= HEADER ================= */

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;

    padding:12px 20px;
    background:#fff;

    box-shadow:0 2px 8px rgba(0,0,0,.1);

    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:70px;

    z-index:1000;
}

.logo{
    font-size:30px;
    color:red;
    font-weight:bold;
    white-space:nowrap;
}

.search{
    flex:1;
    display:flex;
    justify-content:center;
}

.search input{
    width:400px;
    max-width:100%;

    padding:11px 15px;

    border:1px solid #ccc;
    border-radius:6px;

    outline:none;
    font-size:15px;
}

.search input:focus{
    border-color:#888;
}

/* ================= SIDEBAR ================= */

.sidebar{
    position:fixed;

    top:70px;
    left:0;

    width:210px;
    height:calc(100vh - 70px);

    background:#fff;

    padding:20px 12px;

    border-right:1px solid #ddd;

    z-index:900;
}

.sidebar a{
    display:block;

    padding:13px 14px;
    margin-bottom:5px;

    text-decoration:none;
    color:#000;

    border-radius:8px;

    font-size:15px;
}

.sidebar a:hover{
    background:#eee;
}

/* ================= CONTENT ================= */

.content{
    margin-left:210px;
    padding:100px 25px 30px;
}

.video{
    width:100%;
    max-width:900px;

    background:#fff;

    border-radius:10px;

    overflow:hidden;

    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.video iframe{
    display:block;

    width:100%;

    /*
       16:9 responsive video
    */
    aspect-ratio:16 / 9;

    height:auto;

    border:none;
}

.video h2{
    padding:15px 15px 8px;

    font-size:22px;
}

.video p{
    padding:0 15px 20px;

    color:#666;

    line-height:1.5;
}


/* =================================================
   TABLET
   ================================================= */

@media (max-width:900px){

    header{
        padding:12px 15px;
    }

    .logo{
        font-size:26px;
    }

    .search input{
        width:300px;
    }

    .sidebar{
        width:180px;
    }

    .content{
        margin-left:180px;
        padding-left:15px;
        padding-right:15px;
    }
}


/* =================================================
   MOBILE
   ================================================= */

@media (max-width:600px){

    /* HEADER */

    header{
        height:auto;
        min-height:65px;

        padding:10px 12px;

        flex-wrap:wrap;
        gap:8px;
    }

    .logo{
        font-size:24px;
    }

    .search{
        order:3;

        width:100%;
        flex-basis:100%;
    }

    .search input{
        width:100%;
        font-size:14px;
        padding:10px 12px;
    }


    /* MOBILE MENU */

    .sidebar{
        position:fixed;

        top:65px;
        left:0;

        width:100%;
        height:auto;

        padding:7px 8px;

        display:flex;

        overflow-x:auto;

        border-right:none;
        border-bottom:1px solid #ddd;

        white-space:nowrap;

        z-index:900;
    }

    .sidebar a{
        display:inline-block;

        padding:9px 12px;

        margin:0 3px;

        font-size:13px;

        flex-shrink:0;
    }


    /* CONTENT */

    .content{
        margin-left:0;

        padding:125px 10px 20px;
    }

    .video{
        width:100%;

        border-radius:8px;
    }

    .video iframe{
        width:100%;

        aspect-ratio:16 / 9;

        height:auto;
    }

    .video h2{
        font-size:18px;

        padding:13px 12px 7px;
    }

    .video p{
        font-size:14px;

        padding:0 12px 15px;
    }
}


/* =================================================
   VERY SMALL MOBILE
   ================================================= */

@media (max-width:380px){

    .logo{
        font-size:22px;
    }

    .sidebar a{
        padding:8px 10px;
        font-size:12px;
    }

    .content{
        padding-left:7px;
        padding-right:7px;
    }

    .video h2{
        font-size:17px;
    }
}

</style>
</head>


<body>


<!-- ================= HEADER ================= -->

<header>

    <div class="logo">
        MyTube
    </div>

    <div class="search">
        <input
            type="text"
            placeholder="Search..."
        >
    </div>

</header>



<!-- ================= MENU ================= -->

<div class="sidebar">

    <a href="#">🏠 Home</a>

    <a href="#">🔥 Trending</a>

    <a href="#">📺 Subscriptions</a>

    <a href="#">📚 Library</a>

</div>



<!-- ================= CONTENT ================= -->

<div class="content">

    <div class="video">

        <iframe
            src="https://www.youtube.com/embed/_r58G5iM_NU"
            title="YouTube video player"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
        </iframe>

        <h2>
            My YouTube Video
        </h2>

        <p>
            ভিডিওটি সরাসরি YouTube থেকে আপনার ওয়েবসাইটে চলছে।
        </p>

    </div>

</div>


</body>
</html>
