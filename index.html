const countrySearch =
    document.getElementById("countrySearch");

const countryList =
    document.getElementById("countryList");

/* ==================================================
   TIMEZONE -> COUNTRY
   Used for LOCAL TIME
================================================== */

function findCountryByTimezone(zone){

    for(const country of countries){

        if(country.timezones.includes(zone)){

            return country;

        }

    }

    return null;

}


/* ==================================================
   LOCAL TIME
   NO API
================================================== */

function updateLocalClock(){

    const zone =
        Intl.DateTimeFormat()
        .resolvedOptions()
        .timeZone;

    const country =
        findCountryByTimezone(zone);


    function render(){

        const now = new Date();


        const time =
            new Intl.DateTimeFormat(
                "en-US",
                {
                    timeZone:zone,
                    hour:"numeric",
                    minute:"2-digit",
                    second:"2-digit",
                    hour12:true
                }
            ).format(now);


        const date =
            new Intl.DateTimeFormat(
                "en-US",
                {
                    timeZone:zone,
                    weekday:"long",
                    year:"numeric",
                    month:"long",
                    day:"numeric"
                }
            ).format(now);


        document.getElementById("clock")
            .textContent = time;


        document.getElementById("date")
            .textContent = date;


        document.getElementById("localLocation")
            .textContent =
            country
            ? "📍 "+country.country
            : "📍 Local time";


        document.getElementById("localZone")
            .textContent =
            "Time zone: "+zone+
            " • "+getGMTOffset(now,zone);

    }


    render();

    setInterval(render,1000);

}


/* ==================================================
   WORLD TIME SEARCH
================================================== */

function openCountryList(){

    filterCountries();

    countryList.style.display =
        "block";

}


function filterCountries(){

    const query =
        countrySearch.value
        .toLowerCase()
        .trim();


    const filtered =
        countries.filter(
            country => {

                return (

                    country.country
                    .toLowerCase()
                    .includes(query)

                    ||

                    country.code
                    .toLowerCase()
                    .includes(query)

                    ||

                    country.timezones
                    .some(zone =>
                        zone
                        .toLowerCase()
                        .includes(query)
                    )

                );

            }
        );


    countryList.innerHTML = "";


    filtered.forEach(country => {

        const option =
            document.createElement("div");


        option.className =
            "country-option";


        option.innerHTML =
            "🌎 <b>"+
            escapeHTML(country.country)+
            "</b><br>"+
            "<small>"+
            country.timezones.length+
            " timezone"+
            (
                country.timezones.length !== 1
                ? "s"
                : ""
            )+
            "</small>";


        option.onclick =
            () => selectCountry(country);


        countryList.appendChild(option);

    });


    countryList.style.display =
        filtered.length
        ? "block"
        : "none";

}


/* ==================================================
   SELECT COUNTRY
================================================== */

function selectCountry(country){

    activeCountry =
        country;


    countrySearch.value =
        country.country;


    countryList.style.display =
        "none";


    selectedCountry.style.display =
        "block";


    document.getElementById("countryName")
        .textContent =
        "🌎 "+country.country;


    /*
       We don't use only one timezone.

       ALL timezone entries are shown.
    */

    const info =
        document.getElementById("countryInfo");


    info.innerHTML =
        "<b>"+
        country.timezones.length+
        "</b> timezone"+
        (
            country.timezones.length !== 1
            ? "s"
            : ""
        )+
        " available";


    renderAllCountryTimezones(country);

}


/* ==================================================
   RENDER ALL TIMEZONES
================================================== */

function renderAllCountryTimezones(country){

    const old =
        document.getElementById(
            "allTimezoneCards"
        );


    if(old){
        old.remove();
    }


    const container =
        document.createElement("div");


    container.id =
        "allTimezoneCards";


    container.style.marginTop =
        "15px";


    /*
       Create one card for EVERY timezone.
    */

    country.timezones.forEach(
        (zone,index) => {

            const card =
                document.createElement("div");


            card.className =
                "timezone-card";


            card.innerHTML = `

                <div class="timezone-name">
                    ${escapeHTML(
                        getTimezonePlace(zone)
                    )}
                </div>

                <div class="timezone-location">
                    ${escapeHTML(zone)}
                </div>

                <div
                    class="timezone-time"
                    id="tz-time-${index}">
                </div>

                <div
                    class="timezone-date"
                    id="tz-date-${index}">
                </div>

                <div
                    class="timezone-offset"
                    id="tz-offset-${index}">
                </div>

            `;


            container.appendChild(card);

        }
    );


    selectedCountry.appendChild(
        container
    );


    updateAllCountryTimes();


    clearWorldIntervals();


    const interval =
        setInterval(
            updateAllCountryTimes,
            1000
        );


    worldIntervals.push(interval);

}


/* ==================================================
   UPDATE ALL COUNTRY TIMEZONES
================================================== */

function updateAllCountryTimes(){

    if(!activeCountry){
        return;
    }


    const now =
        new Date();


    activeCountry.timezones
        .forEach(
            (zone,index) => {

                const time =
                    new Intl.DateTimeFormat(
                        "en-US",
                        {
                            timeZone:zone,
                            hour:"numeric",
                            minute:"2-digit",
                            second:"2-digit",
                            hour12:true
                        }
                    ).format(now);


                const date =
                    new Intl.DateTimeFormat(
                        "en-US",
                        {
                            timeZone:zone,
                            weekday:"long",
                            year:"numeric",
                            month:"long",
                            day:"numeric"
                        }
                    ).format(now);


                const timeElement =
                    document.getElementById(
                        "tz-time-"+index
                    );


                const dateElement =
                    document.getElementById(
                        "tz-date-"+index
                    );


                const offsetElement =
                    document.getElementById(
                        "tz-offset-"+index
                    );


                if(timeElement)
                    timeElement.textContent =
                        time;


                if(dateElement)
                    dateElement.textContent =
                        date;


                if(offsetElement)
                    offsetElement.textContent =
                        getGMTOffset(
                            now,
                            zone
                        );

            }
        );

}


/* ==================================================
   CLEAR OLD INTERVALS
================================================== */

function clearWorldIntervals(){

    worldIntervals.forEach(
        interval =>
            clearInterval(interval)
    );

    worldIntervals = [];

}


/* ==================================================
   TIMEZONE PLACE NAME
================================================== */

function getTimezonePlace(zone){

    let name =
        zone.split("/").pop();


    name =
        name.replace(
            /_/g,
            " "
        );


    name =
        name.replace(
            /-/g,
            " "
        );


    return name;

}


/* ==================================================
   GMT OFFSET
================================================== */

function getGMTOffset(
    date,
    timezone
){

    try{

        const parts =
            new Intl.DateTimeFormat(
                "en-US",
                {
                    timeZone:timezone,
                    timeZoneName:"longOffset"
                }
            ).formatToParts(date);


        const part =
            parts.find(
                p =>
                    p.type ===
                    "timeZoneName"
            );


        return part
            ? part.value
            : "GMT";

    }
    catch{

        return "GMT";

    }

}

/* ==================================================
   TODO
================================================== */

let todos =
    JSON.parse(
        localStorage.getItem(
            "salmanTodos"
        ) || "[]"
    );


function saveTodos(){

    localStorage.setItem(
        "salmanTodos",
        JSON.stringify(todos)
    );

}


function renderTodos(){

    const list =
        document.getElementById(
            "todoList"
        );


    list.innerHTML = "";


    todos.forEach(
        (todo,index) => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "todo"+
                (
                    todo.done
                    ? " done"
                    : ""
                );


            div.innerHTML = `

                <input
                    type="checkbox"
                    ${todo.done ? "checked" : ""}
                    onchange="toggleTodo(${index})">

                <span>
                    ${escapeHTML(todo.text)}
                </span>

                <button
                    class="delete"
                    onclick="deleteTodo(${index})">
                    ✕
                </button>

            `;


            list.appendChild(div);

        }
    );

}


function addTodo(){

    const input =
        document.getElementById(
            "todoInput"
        );


    const text =
        input.value.trim();


    if(!text)
        return;


    todos.push({
        text:text,
        done:false
    });


    input.value = "";


    saveTodos();

    renderTodos();

}


function todoEnter(event){

    if(event.key === "Enter")
        addTodo();

}


function toggleTodo(index){

    todos[index].done =
        !todos[index].done;


    saveTodos();

    renderTodos();

}


function deleteTodo(index){

    todos.splice(index,1);


    saveTodos();

    renderTodos();

}


renderTodos();


/* ==================================================
   CALCULATOR
================================================== */

function addCalc(value){

    document.getElementById(
        "calcDisplay"
    ).value += value;

}


function clearCalc(){

    document.getElementById(
        "calcDisplay"
    ).value = "";

}


function backCalc(){

    const display =
        document.getElementById(
            "calcDisplay"
        );


    display.value =
        display.value.slice(
            0,
            -1
        );

}


function calculate(){

    const display =
        document.getElementById(
            "calcDisplay"
        );


    try{

        const expression =
            display.value;


        if(
            !/^[0-9+\-*/%.() ]+$/
            .test(expression)
        ){

            throw new Error();

        }


        display.value =
            Function(
                '"use strict";return ('+
                expression+
                ')'
            )();

    }
    catch{

        display.value =
            "Error";

    }

}


/* ==================================================
   TIMER
================================================== */

let timeLeft = 300;

let timer = null;


function updateTimer(){

    const minutes =
        Math.floor(
            timeLeft / 60
        )
        .toString()
        .padStart(2,"0");


    const seconds =
        (timeLeft % 60)
        .toString()
        .padStart(2,"0");


    document.getElementById(
        "timerDisplay"
    ).textContent =
        minutes+":"+seconds;

}


function startTimer(){

    if(timer)
        return;


    timer =
        setInterval(
            () => {

                if(timeLeft <= 0){

                    clearInterval(timer);

                    timer = null;

                    alert(
                        "⏰ Time's up!"
                    );

                    return;

                }


                timeLeft--;

                updateTimer();

            },
            1000
        );

}


function pauseTimer(){

    clearInterval(timer);

    timer = null;

}


function resetTimer(){

    clearInterval(timer);

    timer = null;

    timeLeft = 300;

    updateTimer();

}


updateTimer();

function googleSearch(){

    const query =
        document.getElementById(
            "googleInput"
        ).value.trim();


    if(!query)
        return;


    window.open(
        "https://www.google.com/search?q="+
        encodeURIComponent(query),
        "_blank"
    );

}


function googleEnter(event){

    if(event.key === "Enter")

}

/* ==================================================
   SECURITY
================================================== */

function escapeHTML(text){

    const div =
        document.createElement(
            "div"
        );


    div.textContent = text;


    return div.innerHTML;

}
