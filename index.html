<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>SALMAN</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

:root{
    --bg:#f5f7fb;
    --card:#fff;
    --text:#111;
    --muted:#777;
    --border:#ddd;
    --primary:#111;
    --danger:#e33;
}

body.dark{
    --bg:#151515;
    --card:#222;
    --text:#fff;
    --muted:#aaa;
    --border:#444;
    --primary:#fff;
}

body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    transition:.2s;
}


/* ================= HEADER ================= */

header{
    height:65px;
    position:fixed;
    top:0;
    left:0;
    right:0;
    background:var(--card);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    z-index:1000;
}

.logo{
    font-size:23px;
    font-weight:bold;
}

.header-right{
    display:flex;
    gap:8px;
}

.icon-btn{
    width:40px;
    height:40px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    border-radius:9px;
    cursor:pointer;
    font-size:18px;
}


/* ================= SIDEBAR ================= */

.sidebar{
    position:fixed;
    top:65px;
    left:0;
    width:220px;
    height:calc(100vh - 65px);
    background:var(--card);
    border-right:1px solid var(--border);
    padding:15px;
    z-index:900;
}

.nav{
    width:100%;
    border:0;
    background:transparent;
    color:var(--text);
    text-align:left;
    padding:12px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    margin-bottom:4px;
}

.nav:hover,
.nav.active{
    background:var(--bg);
}


/* ================= MAIN ================= */

main{
    margin-left:220px;
    padding:90px 25px 30px;
    max-width:1500px;
}

.page-title{
    margin-bottom:20px;
}

.page-title h1{
    font-size:28px;
}

.page-title p{
    color:var(--muted);
    margin-top:5px;
}


/* ================= GRID ================= */

.grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:18px;
}


/* ================= CARD ================= */

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px;
    box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.card h2{
    font-size:18px;
    margin-bottom:15px;
}


/* ================= LOCAL TIME ================= */

.local-location{
    color:var(--muted);
    font-size:14px;
    margin-top:6px;
}

.local-zone{
    color:var(--muted);
    font-size:13px;
    margin-top:4px;
}

.clock{
    font-size:38px;
    font-weight:bold;
    margin-top:8px;
}

.date{
    color:var(--muted);
    margin-top:5px;
}


/* ================= WORLD TIME ================= */

.world-search{
    position:relative;
    margin-bottom:12px;
}

.world-search input{
    width:100%;
    padding:11px 13px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    border-radius:9px;
    outline:none;
}

.country-list{
    max-height:320px;
    overflow-y:auto;
    border:1px solid var(--border);
    border-radius:9px;
    background:var(--card);
    display:none;
}

.country-option{
    padding:11px 12px;
    cursor:pointer;
    border-bottom:1px solid var(--border);
    font-size:14px;
}

.country-option:last-child{
    border-bottom:0;
}

.country-option:hover{
    background:var(--bg);
}

.country-option strong{
    display:block;
    font-size:15px;
}

.country-option small{
    color:var(--muted);
}

.world-results{
    display:none;
    margin-top:12px;
}

.world-results-title{
    color:var(--muted);
    font-size:13px;
    margin-bottom:8px;
}

.timezone-card{
    border:1px solid var(--border);
    background:var(--bg);
    border-radius:10px;
    padding:14px;
    margin-bottom:9px;
}

.timezone-name{
    font-weight:bold;
    font-size:16px;
}

.timezone-location{
    color:var(--muted);
    font-size:13px;
    margin-top:4px;
}

.timezone-time{
    font-size:27px;
    font-weight:bold;
    margin-top:9px;
}

.timezone-date{
    color:var(--muted);
    font-size:13px;
    margin-top:4px;
}

.timezone-offset{
    color:var(--muted);
    font-size:13px;
    margin-top:4px;
}


/* ================= NOTES ================= */

textarea{
    width:100%;
    min-height:180px;
    resize:vertical;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    border-radius:8px;
    padding:11px;
    outline:none;
}


/* ================= TODO ================= */

.todo-input{
    display:flex;
    gap:8px;
}

input{
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    border-radius:8px;
    padding:11px;
    outline:none;
}

.todo-input input{
    width:100%;
}

.primary{
    border:0;
    background:var(--primary);
    color:var(--bg);
    border-radius:8px;
    padding:0 15px;
    cursor:pointer;
    font-weight:bold;
}

.todo-list{
    margin-top:15px;
}

.todo{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--border);
}

.todo span{
    flex:1;
}

.todo.done span{
    text-decoration:line-through;
    color:var(--muted);
}

.delete{
    border:0;
    background:none;
    color:var(--danger);
    cursor:pointer;
    font-size:16px;
}


/* ================= CALCULATOR ================= */

.calculator{
    max-width:350px;
}

.calc-display{
    width:100%;
    height:55px;
    margin-bottom:10px;
    text-align:right;
    font-size:25px;
}

.calc-buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
}

.calc-buttons button{
    height:48px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

.calc-buttons button:hover{
    opacity:.7;
}


/* ================= TIMER ================= */

.timer{
    font-size:45px;
    font-weight:bold;
    text-align:center;
    padding:15px;
}

.timer-controls{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
}

.timer-controls button{
    padding:10px 15px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    border-radius:8px;
    cursor:pointer;
}


/* ================= SEARCH ================= */

.search-box{
    display:flex;
    gap:8px;
}

.search-box input{
    width:100%;
}

.search-box button{
    height:42px;
}


/* ================= STATUS ================= */

.loading{
    color:var(--muted);
    font-size:14px;
    padding:8px 0;
}

.error{
    color:#d33;
    font-size:14px;
    padding:8px 0;
}


/* ================= MOBILE ================= */

@media(max-width:800px){

    .sidebar{
        width:100%;
        height:55px;
        top:65px;
        display:flex;
        overflow-x:auto;
        padding:6px;
        border-right:0;
        border-bottom:1px solid var(--border);
    }

    .nav{
        width:auto;
        white-space:nowrap;
        padding:9px 12px;
        margin:0;
    }

    main{
        margin-left:0;
        padding:135px 12px 25px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .page-title h1{
        font-size:24px;
    }

    .clock{
        font-size:30px;
    }

    .timezone-time{
        font-size:25px;
    }

}

@media(max-width:400px){

    header{
        padding:0 12px;
    }

    .logo{
        font-size:20px;
    }

    .card{
        padding:14px;
    }

}

</style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header>

    <div class="logo">
        SALMAN
    </div>

    <div class="header-right">

        <button
            class="icon-btn"
            onclick="toggleDark()"
            id="themeBtn">
            🌙
        </button>

    </div>

</header>



<!-- ================= SIDEBAR ================= -->

<nav class="sidebar">

    <button
        class="nav active"
        onclick="showAll()">
        🏠 Dashboard
    </button>

    <button
        class="nav"
        onclick="focusSection('worldTime')">
        🌎 World Time
    </button>

    <button
        class="nav"
        onclick="focusSection('notes')">
        📝 Notes
    </button>

    <button
        class="nav"
        onclick="focusSection('todo')">
        ✅ Tasks
    </button>

    <button
        class="nav"
        onclick="focusSection('calculator')">
        🧮 Calculator
    </button>

    <button
        class="nav"
        onclick="focusSection('timer')">
        ⏱️ Timer
    </button>

    <button
        class="nav"
        onclick="focusSection('search')">
        🔎 Search
    </button>

</nav>



<!-- ================= MAIN ================= -->

<main>


<div class="page-title">

    <h1>SALMAN</h1>

    <p>
        Your personal all-in-one utility dashboard.
    </p>

</div>



<div class="grid">


<!-- ================= LOCAL CLOCK ================= -->

<section class="card">

    <h2>🕐 Your Local Time</h2>

    <div
        class="clock"
        id="clock">
        Loading...
    </div>

    <div
        class="date"
        id="date">
    </div>

    <div
        class="local-location"
        id="localLocation">
        Detecting your location...
    </div>

    <div
        class="local-zone"
        id="localZone">
    </div>

</section>



<!-- ================= WORLD TIME ================= -->

<section
    class="card"
    id="worldTime">

    <h2>🌎 World Time</h2>

    <div class="world-search">

        <input
            id="countrySearch"
            placeholder="Search any country or capital..."
            autocomplete="off"
            oninput="filterCountries()"
            onclick="openCountryList()">

    </div>

    <div
        class="country-list"
        id="countryList">
    </div>

    <div
        class="world-results"
        id="worldResults">

        <div
            class="world-results-title"
            id="worldResultsTitle">
        </div>

        <div id="timezoneResults"></div>

    </div>

</section>



<!-- ================= NOTES ================= -->

<section
    class="card"
    id="notes">

    <h2>📝 Notes</h2>

    <textarea
        id="notesBox"
        placeholder="Write your notes here...">
    </textarea>

</section>



<!-- ================= TODO ================= -->

<section
    class="card"
    id="todo">

    <h2>✅ To-Do List</h2>

    <div class="todo-input">

        <input
            id="todoInput"
            placeholder="Add a task..."
            onkeydown="todoEnter(event)">

        <button
            class="primary"
            onclick="addTodo()">
            Add
        </button>

    </div>

    <div
        class="todo-list"
        id="todoList">
    </div>

</section>



<!-- ================= CALCULATOR ================= -->

<section
    class="card calculator"
    id="calculator">

    <h2>🧮 Calculator</h2>

    <input
        class="calc-display"
        id="calcDisplay"
        readonly>

    <div class="calc-buttons">

        <button onclick="clearCalc()">C</button>
        <button onclick="backCalc()">⌫</button>
        <button onclick="addCalc('%')">%</button>
        <button onclick="addCalc('/')">÷</button>

        <button onclick="addCalc('7')">7</button>
        <button onclick="addCalc('8')">8</button>
        <button onclick="addCalc('9')">9</button>
        <button onclick="addCalc('*')">×</button>

        <button onclick="addCalc('4')">4</button>
        <button onclick="addCalc('5')">5</button>
        <button onclick="addCalc('6')">6</button>
        <button onclick="addCalc('-')">−</button>

        <button onclick="addCalc('1')">1</button>
        <button onclick="addCalc('2')">2</button>
        <button onclick="addCalc('3')">3</button>
        <button onclick="addCalc('+')">+</button>

        <button onclick="addCalc('0')">0</button>
        <button onclick="addCalc('.')">.</button>
        <button onclick="calculate()">=</button>

    </div>

</section>



<!-- ================= TIMER ================= -->

<section
    class="card"
    id="timer">

    <h2>⏱️ 5-Minute Timer</h2>

    <div
        class="timer"
        id="timerDisplay">
        05:00
    </div>

    <div class="timer-controls">

        <button onclick="startTimer()">
            ▶ Start
        </button>

        <button onclick="pauseTimer()">
            ⏸ Pause
        </button>

        <button onclick="resetTimer()">
            ↻ Reset
        </button>

    </div>

</section>



<!-- ================= GOOGLE SEARCH ================= -->

<section
    class="card"
    id="search">

    <h2>🔎 Quick Search</h2>

    <div class="search-box">

        <input
            id="googleInput"
            placeholder="Search Google..."
            onkeydown="googleEnter(event)">

        <button
            class="primary"
            onclick="googleSearch()">
            Search
        </button>

    </div>

</section>


</div>

</main>



<script>


/* ==================================================
   GLOBAL VARIABLES
================================================== */

let countries = [];

let selectedCountry = null;

let worldTimer = null;

let localTimezone =
    Intl.DateTimeFormat().resolvedOptions().timeZone;


/* ==================================================
   COUNTRY DATA
   Loaded from REST COUNTRIES API

   This gives:
   - ALL countries
   - Country names
   - Capitals
   - ISO codes
   - ALL timezone identifiers supplied
================================================== */

async function loadCountries(){

    const list =
        document.getElementById("countryList");

    list.innerHTML =
        '<div class="loading">Loading all countries...</div>';

    try{

        const response =
            await fetch(
                "https://restcountries.com/v3.1/all?fields=name,capital,cca2,timezones"
            );

        if(!response.ok){
            throw new Error();
        }

        const data =
            await response.json();


        countries =
            data
            .map(function(item){

                return {

                    country:
                        item.name?.common ||
                        "Unknown",

                    official:
                        item.name?.official ||
                        "",

                    capital:
                        Array.isArray(item.capital)
                        ? item.capital[0]
                        : "N/A",

                    code:
                        item.cca2 || "",

                    timezones:
                        Array.isArray(item.timezones)
                        ? item.timezones
                        : []

                };

            })
            .filter(function(item){

                return item.country &&
                       item.timezones.length;

            })
            .sort(function(a,b){

                return a.country.localeCompare(
                    b.country
                );

            });


        filterCountries();

        detectLocalLocation();

    }
    catch(error){

        list.innerHTML =
            '<div class="error">'+
            'Could not load country database. '+
            'Please check your internet connection.'+
            '</div>';

        detectLocalLocation();

    }

}


/* ==================================================
   LOCAL LOCATION DETECTION
================================================== */

async function detectLocalLocation(){

    /*
       First try IP location.
       This identifies the visitor's country.
    */

    try{

        const response =
            await fetch(
                "https://ipapi.co/json/"
            );

        if(!response.ok){
            throw new Error();
        }

        const location =
            await response.json();


        const countryCode =
            location.country_code;


        const matched =
            countries.find(function(item){

                return item.code === countryCode;

            });


        if(matched){

            updateLocalClock(
                matched,
                localTimezone
            );

            return;

        }

    }
    catch(error){

        // Fallback below

    }


    /*
       Fallback:
       Use browser's timezone.
    */

    const matchedTimezone =
        findCountryByTimezone(
            localTimezone
        );


    if(matchedTimezone){

        updateLocalClock(
            matchedTimezone.country,
            localTimezone
        );

    }
    else{

        updateLocalClock(
            null,
            localTimezone
        );

    }

}


/* ==================================================
   FIND COUNTRY USING TIMEZONE
================================================== */

function findCountryByTimezone(timezone){

    for(
        const country of countries
    ){

        if(
            country.timezones.includes(
                timezone
            )
        ){

            return {
                country:country,
                timezone:timezone
            };

        }

    }

    return null;

}


/* ==================================================
   LOCAL CLOCK
================================================== */

function updateLocalClock(
    country,
    timezone
){

    function render(){

        const now =
            new Date();


        const time =
            new Intl.DateTimeFormat(
                "en-US",
                {
                    timeZone:timezone,
                    hour:"numeric",
                    minute:"2-digit",
                    second:"2-digit",
                    hour12:true
                }
            ).format(now);


        const date =
            new Intl.DateTimeFormat(
                "en-US",
                {
                    timeZone:timezone,
                    weekday:"long",
                    year:"numeric",
                    month:"long",
                    day:"numeric"
                }
            ).format(now);


        const offset =
            getGMTOffset(
                now,
                timezone
            );


        document.getElementById(
            "clock"
        ).textContent = time;


        document.getElementById(
            "date"
        ).textContent = date;


        if(country){

            document.getElementById(
                "localLocation"
            ).textContent =
                "📍 "+
                country.country+
                " — "+
                country.capital;


        }
        else{

            document.getElementById(
                "localLocation"
            ).textContent =
                "📍 Local location";

        }


        document.getElementById(
            "localZone"
        ).textContent =
            "Time zone: "+
            timezone+
            " • "+
            offset;

    }


    render();

    setInterval(
        render,
        1000
    );

}


/* ==================================================
   WORLD TIME SEARCH
================================================== */

function openCountryList(){

    filterCountries();

    document.getElementById(
        "countryList"
    ).style.display = "block";

}


function filterCountries(){

    const search =
        document.getElementById(
            "countrySearch"
        );

    const list =
        document.getElementById(
            "countryList"
        );


    const query =
        search.value
        .toLowerCase()
        .trim();


    if(!countries.length){

        list.innerHTML =
            '<div class="loading">'+
            'Loading countries...'+
            '</div>';

        list.style.display =
            "block";

        return;

    }


    const filtered =
        countries.filter(
            function(item){

                return (

                    item.country
                    .toLowerCase()
                    .includes(query)

                    ||

                    item.official
                    .toLowerCase()
                    .includes(query)

                    ||

                    item.capital
                    .toLowerCase()
                    .includes(query)

                    ||

                    item.code
                    .toLowerCase()
                    .includes(query)

                );

            }
        );


    list.innerHTML = "";


    filtered.forEach(
        function(item){

            const option =
                document.createElement(
                    "div"
                );

            option.className =
                "country-option";


            option.innerHTML =
                "🌎 <strong>"+
                escapeHTML(
                    item.country
                )+
                "</strong>"+
                "<small>"+
                escapeHTML(
                    item.capital
                )+
                " • "+
                item.timezones.length+
                " timezone"+
                (
                    item.timezones.length !== 1
                    ? "s"
                    : ""
                )+
                "</small>";


            option.onclick =
                function(){

                    selectCountry(item);

                };


            list.appendChild(
                option
            );

        }
    );


    list.style.display =
        filtered.length
        ? "block"
        : "none";

}


/* ==================================================
   SELECT COUNTRY
================================================== */

function selectCountry(country){

    selectedCountry =
        country;


    document.getElementById(
        "countrySearch"
    ).value =
        country.country;


    document.getElementById(
        "countryList"
    ).style.display =
        "none";


    document.getElementById(
        "worldResults"
    ).style.display =
        "block";


    document.getElementById(
        "worldResultsTitle"
    ).textContent =
        country.country+
        " — "+
        country.timezones.length+
        " timezone"+
        (
            country.timezones.length !== 1
            ? "s"
            : ""
        );


    renderCountryTimezones(
        country
    );

}


/* ==================================================
   RENDER ALL TIMEZONES OF COUNTRY
================================================== */

function renderCountryTimezones(country){

    const container =
        document.getElementById(
            "timezoneResults"
        );


    container.innerHTML = "";


    /*
       IMPORTANT:

       Every timezone supplied for the
       country is displayed.

       If a country has 20 timezone
       entries, all 20 are displayed.
    */

    country.timezones.forEach(
        function(timezone,index){

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "timezone-card";


            const placeName =
                getTimezonePlace(
                    timezone
                );


            card.innerHTML = `

                <div class="timezone-name">
                    ${escapeHTML(placeName)}
                </div>

                <div class="timezone-location">
                    ${escapeHTML(timezone)}
                </div>

                <div
                    class="timezone-time"
                    id="world-time-${index}">
                </div>

                <div
                    class="timezone-date"
                    id="world-date-${index}">
                </div>

                <div
                    class="timezone-offset"
                    id="world-offset-${index}">
                </div>

            `;


            container.appendChild(
                card
            );

        }
    );


    updateSelectedCountryTimes();


    clearInterval(
        worldTimer
    );


    worldTimer =
        setInterval(
            updateSelectedCountryTimes,
            1000
        );

}


/* ==================================================
   UPDATE ALL SELECTED COUNTRY TIMEZONES
================================================== */

function updateSelectedCountryTimes(){

    if(!selectedCountry){
        return;
    }


    selectedCountry.timezones
        .forEach(
            function(timezone,index){

                const now =
                    new Date();


                const time =
                    new Intl.DateTimeFormat(
                        "en-US",
                        {
                            timeZone:timezone,
                            hour:"numeric",
                            minute:"2-digit",
                            second:"2-digit",
                            hour12:true
                        }
                    ).format(now);


                const date =
                    new Intl.DateTimeFormat(
                        "en-US",
                        {
                            timeZone:timezone,
                            weekday:"long",
                            year:"numeric",
                            month:"long",
                            day:"numeric"
                        }
                    ).format(now);


                const offset =
                    getGMTOffset(
                        now,
                        timezone
                    );


                const timeElement =
                    document.getElementById(
                        "world-time-"+index
                    );


                const dateElement =
                    document.getElementById(
                        "world-date-"+index
                    );


                const offsetElement =
                    document.getElementById(
                        "world-offset-"+index
                    );


                if(timeElement){

                    timeElement.textContent =
                        time;

                }


                if(dateElement){

                    dateElement.textContent =
                        date;

                }


                if(offsetElement){

                    offsetElement.textContent =
                        offset;

                }

            }
        );

}


/* ==================================================
   TIMEZONE PLACE NAME
================================================== */

function getTimezonePlace(timezone){

    /*
       Converts:

       America/New_York
       ->
       New York

       Asia/Kolkata
       ->
       Kolkata

       Europe/London
       ->
       London
    */

    const parts =
        timezone.split("/");


    if(parts.length < 2){

        return timezone;

    }


    let place =
        parts[parts.length-1];


    place =
        place.replace(
            /_/g,
            " "
        );


    place =
        place.replace(
            /-/g,
            " "
        );


    return place;

}


/* ==================================================
   GMT OFFSET
================================================== */

function getGMTOffset(
    date,
    timezone
){

    try{

        const parts =
            new Intl.DateTimeFormat(
                "en-US",
                {
                    timeZone:timezone,
                    timeZoneName:"longOffset"
                }
            ).formatToParts(date);


        const part =
            parts.find(
                function(p){

                    return p.type ===
                        "timeZoneName";

                }
            );


        if(!part){

            return "GMT";

        }


        return part.value;

    }
    catch{

        return "GMT";

    }

}

let todos =
    JSON.parse(
        localStorage.getItem(
            "salmanTodos"
        ) || "[]"
    );


function saveTodos(){

    localStorage.setItem(
        "salmanTodos",
        JSON.stringify(todos)
    );

}


function renderTodos(){

    const list =
        document.getElementById(
            "todoList"
        );


    list.innerHTML = "";


    todos.forEach(
        function(todo,index){

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "todo"+
                (
                    todo.done
                    ? " done"
                    : ""
                );


            div.innerHTML = `

                <input
                    type="checkbox"
                    ${todo.done?"checked":""}
                    onchange="toggleTodo(${index})">

                <span>
                    ${escapeHTML(todo.text)}
                </span>

                <button
                    class="delete"
                    onclick="deleteTodo(${index})">
                    ✕
                </button>

            `;


            list.appendChild(
                div
            );

        }
    );

}


function addTodo(){

    const input =
        document.getElementById(
            "todoInput"
        );


    const text =
        input.value.trim();


    if(!text){
        return;
    }


    todos.push({

        text:text,
        done:false

    });


    input.value = "";


    saveTodos();

    renderTodos();

}


function todoEnter(event){

    if(event.key === "Enter"){

        addTodo();

    }

}


function toggleTodo(index){

    todos[index].done =
        !todos[index].done;


    saveTodos();

    renderTodos();

}


function deleteTodo(index){

    todos.splice(
        index,
        1
    );


    saveTodos();

    renderTodos();

}


renderTodos();

   CALCULATOR
================================================== */

function addCalc(value){

    document.getElementById(
        "calcDisplay"
    ).value += value;

}


function clearCalc(){

    document.getElementById(
        "calcDisplay"
    ).value = "";

}


function backCalc(){

    const display =
        document.getElementById(
            "calcDisplay"
        );


    display.value =
        display.value.slice(
            0,
            -1
        );

}


function calculate(){

    const display =
        document.getElementById(
            "calcDisplay"
        );


    try{

        const expression =
            display.value;


        if(
            !/^[0-9+\-*/%.() ]+$/
            .test(expression)
        ){

            throw new Error();

        }


        display.value =
            Function(
                '"use strict";return ('+
                expression+
                ')'
            )();

    }
    catch{

        display.value =
            "Error";

    }

}


/* ==================================================
   TIMER
================================================== */

let timeLeft = 300;

let timer = null;


function updateTimer(){

    const minutes =
        Math.floor(
            timeLeft / 60
        )
        .toString()
        .padStart(
            2,
            "0"
        );


    const seconds =
        (
            timeLeft % 60
        )
        .toString()
        .padStart(
            2,
            "0"
        );


    document.getElementById(
        "timerDisplay"
    ).textContent =
        minutes+
        ":"+
        seconds;

}


function startTimer(){

    if(timer){
        return;
    }


    timer =
        setInterval(
            function(){

                if(
                    timeLeft <= 0
                ){

                    clearInterval(
                        timer
                    );

                    timer = null;


                    alert(
                        "⏰ Time's up!"
                    );


                    return;

                }


                timeLeft--;

                updateTimer();

            },
            1000
        );

}


function pauseTimer(){

    clearInterval(
        timer
    );

    timer = null;

}


function resetTimer(){

    clearInterval(
        timer
    );

    timer = null;

    timeLeft = 300;

    updateTimer();

}


updateTimer();
