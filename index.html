<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyTube</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 20px;
    background:#ffffff;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
    position:fixed;
    top:0;
    width:100%;
    z-index:1000;
}

.logo{
    font-size:30px;
    color:red;
    font-weight:bold;
}

.search input{
    width:350px;
    max-width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

.sidebar{
    position:fixed;
    top:70px;
    left:0;
    width:200px;
    height:100%;
    background:#fff;
    padding:20px;
    border-right:1px solid #ddd;
}

.sidebar a{
    display:block;
    padding:12px;
    text-decoration:none;
    color:#000;
    border-radius:8px;
}

.sidebar a:hover{
    background:#eee;
}

.content{
    margin-left:220px;
    margin-top:90px;
    padding:20px;
}

.video{
    max-width:900px;
    background:#fff;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.video iframe{
    width:100%;
    height:500px;
    border:none;
}

.video h2{
    padding:15px;
}

.video p{
    padding:0 15px 20px;
    color:#666;
}
</style>
</head>

<body>

<header>
    <div class="logo">MyTube</div>

    <div class="search">
        <input type="text" placeholder="Search...">
    </div>
</header>

<div class="sidebar">
    <a href="#">🏠 Home</a>
    <a href="#">🔥 Trending</a>
    <a href="#">📺 Subscriptions</a>
    <a href="#">📚 Library</a>
</div>

<div class="content">

<div class="video">

<iframe
src="https://www.youtube.com/embed/_r58G5iM_NU"
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
allowfullscreen>
</iframe>

<h2>My YouTube Video</h2>

<p>
ভিডিওটি সরাসরি YouTube থেকে আপনার ওয়েবসাইটে চলছে।
</p>

</div>

</div>

</body>
</html>
