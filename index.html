<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>LifeHub</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

:root{
    --bg:#f5f7fb;
    --card:#fff;
    --text:#111;
    --muted:#777;
    --border:#ddd;
    --primary:#111;
}

body.dark{
    --bg:#151515;
    --card:#222;
    --text:#fff;
    --muted:#aaa;
    --border:#444;
    --primary:#fff;
}

body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    transition:.2s;
}

/* HEADER */

header{
    height:65px;
    position:fixed;
    top:0;
    left:0;
    right:0;

    background:var(--card);
    border-bottom:1px solid var(--border);

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 20px;

    z-index:1000;
}

.logo{
    font-size:23px;
    font-weight:bold;
}

.header-right{
    display:flex;
    gap:8px;
}

.icon-btn{
    width:40px;
    height:40px;

    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);

    border-radius:9px;

    cursor:pointer;
    font-size:18px;
}

/* SIDEBAR */

.sidebar{
    position:fixed;

    top:65px;
    left:0;

    width:220px;
    height:calc(100vh - 65px);

    background:var(--card);

    border-right:1px solid var(--border);

    padding:15px;

    z-index:900;
}

.nav{
    width:100%;

    border:0;
    background:transparent;

    color:var(--text);

    text-align:left;

    padding:12px;

    border-radius:8px;

    cursor:pointer;

    font-size:14px;

    margin-bottom:4px;
}

.nav:hover,
.nav.active{
    background:var(--bg);
}

/* MAIN */

main{
    margin-left:220px;

    padding:90px 25px 30px;

    max-width:1300px;
}

.page-title{
    margin-bottom:20px;
}

.page-title h1{
    font-size:28px;
}

.page-title p{
    color:var(--muted);
    margin-top:5px;
}

/* GRID */

.grid{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:18px;
}

/* CARD */

.card{
    background:var(--card);

    border:1px solid var(--border);

    border-radius:14px;

    padding:18px;

    box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.card h2{
    font-size:18px;
    margin-bottom:15px;
}

/* CLOCK */

.clock{
    font-size:38px;
    font-weight:bold;
}

.date{
    color:var(--muted);
    margin-top:5px;
}

/* TODO */

.todo-input{
    display:flex;
    gap:8px;
}

input,
textarea{
    width:100%;

    border:1px solid var(--border);

    background:var(--card);
    color:var(--text);

    border-radius:8px;

    padding:11px;

    outline:none;
}

textarea{
    min-height:180px;
    resize:vertical;
}

.primary{
    border:0;

    background:var(--primary);

    color:
        var(--bg);

    border-radius:8px;

    padding:0 15px;

    cursor:pointer;

    font-weight:bold;
}

.todo-list{
    margin-top:15px;
}

.todo{
    display:flex;

    align-items:center;

    gap:10px;

    padding:10px 0;

    border-bottom:1px solid var(--border);
}

.todo span{
    flex:1;
}

.todo.done span{
    text-decoration:line-through;
    color:var(--muted);
}

.delete{
    border:0;
    background:none;
    color:#e33;
    cursor:pointer;
    font-size:16px;
}

/* CALCULATOR */

.calculator{
    max-width:350px;
}

.calc-display{
    width:100%;
    height:55px;

    margin-bottom:10px;

    text-align:right;

    font-size:25px;
}

.calc-buttons{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:7px;
}

.calc-buttons button{
    height:48px;

    border:1px solid var(--border);

    background:var(--bg);

    color:var(--text);

    border-radius:8px;

    cursor:pointer;

    font-size:16px;
}

.calc-buttons button:hover{
    opacity:.7;
}

/* TIMER */

.timer{
    font-size:45px;
    font-weight:bold;
    text-align:center;
    padding:15px;
}

.timer-controls{
    display:flex;
    justify-content:center;
    gap:8px;
}

.timer-controls button{
    padding:10px 15px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    border-radius:8px;
    cursor:pointer;
}

/* SEARCH */

.search-box{
    display:flex;
    gap:8px;
}

.search-box button{
    height:42px;
}

/* MOBILE */

@media(max-width:800px){

    .sidebar{
        width:100%;
        height:55px;

        top:65px;

        display:flex;

        overflow-x:auto;

        padding:6px;

        border-right:0;
        border-bottom:1px solid var(--border);
    }

    .nav{
        width:auto;
        white-space:nowrap;

        padding:9px 12px;

        margin:0;
    }

    main{
        margin-left:0;

        padding:135px 12px 25px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .page-title h1{
        font-size:24px;
    }

    .clock{
        font-size:30px;
    }

}

@media(max-width:400px){

    header{
        padding:0 12px;
    }

    .logo{
        font-size:20px;
    }

    .card{
        padding:14px;
    }

}
</style>
</head>


<body>


<!-- HEADER -->

<header>

    <div class="logo">
        LifeHub
    </div>

    <div class="header-right">

        <button
            class="icon-btn"
            onclick="toggleDark()"
            id="themeBtn">
            🌙
        </button>

    </div>

</header>


<!-- SIDEBAR -->

<nav class="sidebar">

    <button
        class="nav active"
        onclick="showAll()">
        🏠 Dashboard
    </button>

    <button
        class="nav"
        onclick="focusSection('notes')">
        📝 Notes
    </button>

    <button
        class="nav"
        onclick="focusSection('todo')">
        ✅ Tasks
    </button>

    <button
        class="nav"
        onclick="focusSection('calculator')">
        🧮 Calculator
    </button>

    <button
        class="nav"
        onclick="focusSection('timer')">
        ⏱️ Timer
    </button>

    <button
        class="nav"
        onclick="focusSection('search')">
        🔎 Search
    </button>

</nav>


<!-- MAIN -->

<main>

    <div class="page-title">

        <h1>
            LifeHub
        </h1>

        <p>
            Your simple all-in-one utility dashboard.
        </p>

    </div>


    <div class="grid">


        <!-- CLOCK -->

        <section class="card">

            <h2>🕐 Clock</h2>

            <div
                class="clock"
                id="clock">
                00:00:00
            </div>

            <div
                class="date"
                id="date">
            </div>

        </section>



        <!-- SEARCH -->

        <section
            class="card"
            id="search">

            <h2>🔎 Quick Search</h2>

            <div class="search-box">

                <input
                    id="googleInput"
                    placeholder="Search Google...">

                <button
                    class="primary"
                    onclick="googleSearch()">
                    Search
                </button>

            </div>

        </section>



        <!-- NOTES -->

        <section
            class="card"
            id="notes">

            <h2>📝 Notes</h2>

            <textarea
                id="notesBox"
                placeholder="Write your notes here...">
            </textarea>

        </section>



        <!-- TODO -->

        <section
            class="card"
            id="todo">

            <h2>✅ To-Do List</h2>

            <div class="todo-input">

                <input
                    id="todoInput"
                    placeholder="Add a task..."
                    onkeydown="todoEnter(event)">

                <button
                    class="primary"
                    onclick="addTodo()">
                    Add
                </button>

            </div>

            <div
                class="todo-list"
                id="todoList">
            </div>

        </section>



        <!-- CALCULATOR -->

        <section
            class="card calculator"
            id="calculator">

            <h2>🧮 Calculator</h2>

            <input
                class="calc-display"
                id="calcDisplay"
                readonly>

            <div class="calc-buttons">

                <button onclick="clearCalc()">C</button>
                <button onclick="backCalc()">⌫</button>
                <button onclick="addCalc('%')">%</button>
                <button onclick="addCalc('/')">÷</button>

                <button onclick="addCalc('7')">7</button>
                <button onclick="addCalc('8')">8</button>
                <button onclick="addCalc('9')">9</button>
                <button onclick="addCalc('*')">×</button>

                <button onclick="addCalc('4')">4</button>
                <button onclick="addCalc('5')">5</button>
                <button onclick="addCalc('6')">6</button>
                <button onclick="addCalc('-')">−</button>

                <button onclick="addCalc('1')">1</button>
                <button onclick="addCalc('2')">2</button>
                <button onclick="addCalc('3')">3</button>
                <button onclick="addCalc('+')">+</button>

                <button onclick="addCalc('0')">0</button>
                <button onclick="addCalc('.')">.</button>
                <button onclick="calculate()">=</button>

            </div>

        </section>



        <!-- TIMER -->

        <section
            class="card"
            id="timer">

            <h2>⏱️ 5-Minute Timer</h2>

            <div
                class="timer"
                id="timerDisplay">
                05:00
            </div>

            <div class="timer-controls">

                <button onclick="startTimer()">
                    ▶ Start
                </button>

                <button onclick="pauseTimer()">
                    ⏸ Pause
                </button>

                <button onclick="resetTimer()">
                    ↻ Reset
                </button>

            </div>

        </section>


    </div>

</main>



<script>

/* ================= CLOCK ================= */

function updateClock(){

    const now = new Date();

    document.getElementById("clock")
        .textContent =
        now.toLocaleTimeString();

    document.getElementById("date")
        .textContent =
        now.toLocaleDateString(
            undefined,
            {
                weekday:"long",
                year:"numeric",
                month:"long",
                day:"numeric"
            }
        );
}

setInterval(updateClock,1000);

updateClock();


/* ================= DARK MODE ================= */

function toggleDark(){

    document.body.classList.toggle("dark");

    const dark =
        document.body.classList.contains("dark");

    localStorage.setItem(
        "darkMode",
        dark
    );

    document.getElementById("themeBtn")
        .textContent =
        dark ? "☀️" : "🌙";
}


if(localStorage.getItem("darkMode")==="true"){

    document.body.classList.add("dark");

    document.getElementById("themeBtn")
        .textContent="☀️";

}


/* ================= NOTES ================= */

const notes =
    document.getElementById("notesBox");

notes.value =
    localStorage.getItem("lifeNotes") || "";

notes.addEventListener(
    "input",
    function(){

        localStorage.setItem(
            "lifeNotes",
            notes.value
        );

    }
);


/* ================= TODO ================= */

let todos =
    JSON.parse(
        localStorage.getItem("lifeTodos") || "[]"
    );


function saveTodos(){

    localStorage.setItem(
        "lifeTodos",
        JSON.stringify(todos)
    );

}


function renderTodos(){

    const list =
        document.getElementById("todoList");

    list.innerHTML="";


    todos.forEach(
        function(todo,index){

            const div =
                document.createElement("div");

            div.className =
                "todo" +
                (todo.done ? " done" : "");


            div.innerHTML = `

                <input
                    type="checkbox"
                    ${todo.done ? "checked" : ""}
                    onchange="toggleTodo(${index})">

                <span>
                    ${escapeHTML(todo.text)}
                </span>

                <button
                    class="delete"
                    onclick="deleteTodo(${index})">
                    ✕
                </button>

            `;

            list.appendChild(div);

        }
    );

}


function addTodo(){

    const input =
        document.getElementById("todoInput");

    const text =
        input.value.trim();

    if(!text) return;

    todos.push({
        text:text,
        done:false
    });

    input.value="";

    saveTodos();
    renderTodos();

}


function todoEnter(event){

    if(event.key==="Enter"){
        addTodo();
    }

}


function toggleTodo(index){

    todos[index].done =
        !todos[index].done;

    saveTodos();
    renderTodos();

}


function deleteTodo(index){

    todos.splice(index,1);

    saveTodos();
    renderTodos();

}


function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent=text;

    return div.innerHTML;

}

renderTodos();


/* ================= CALCULATOR ================= */

function addCalc(value){

    document.getElementById(
        "calcDisplay"
    ).value += value;

}


function clearCalc(){

    document.getElementById(
        "calcDisplay"
    ).value="";

}


function backCalc(){

    const display =
        document.getElementById(
            "calcDisplay"
        );

    display.value =
        display.value.slice(0,-1);

}


function calculate(){

    const display =
        document.getElementById(
            "calcDisplay"
        );

    try{

        const expression =
            display.value;

        if(!/^[0-9+\-*/%.() ]+$/.test(expression)){
            throw new Error();
        }

        display.value =
            Function(
                '"use strict";return (' +
                expression +
                ')'
            )();

    }catch{

        display.value="Error";

    }

}


/* ================= TIMER ================= */

let timeLeft=300;
let timer=null;


function updateTimer(){

    const minutes =
        Math.floor(timeLeft/60)
        .toString()
        .padStart(2,"0");

    const seconds =
        (timeLeft%60)
        .toString()
        .padStart(2,"0");

    document.getElementById(
        "timerDisplay"
    ).textContent =
        minutes + ":" + seconds;

}


function startTimer(){

    if(timer) return;

    timer =
        setInterval(
            function(){

                if(timeLeft<=0){

                    clearInterval(timer);

                    timer=null;

                    alert("⏰ Time's up!");

                    return;

                }

                timeLeft--;

                updateTimer();

            },
            1000
        );

}


function pauseTimer(){

    clearInterval(timer);

    timer=null;

}


function resetTimer(){

    clearInterval(timer);

    timer=null;

    timeLeft=300;

    updateTimer();

}


updateTimer();


/* ================= GOOGLE SEARCH ================= */

function googleSearch(){

    const query =
        document.getElementById(
            "googleInput"
        ).value.trim();

    if(!query) return;

    window.open(
        "https://www.google.com/search?q=" +
        encodeURIComponent(query),
        "_blank"
    );

}


/* ================= NAVIGATION ================= */

function focusSection(id){

    const element =
        document.getElementById(id);

    if(element){

        element.scrollIntoView({
            behavior:"smooth",
            block:"center"
        });

    }

}


function showAll(){

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

</script>

</body>
</html>
