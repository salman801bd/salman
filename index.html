<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MyTube</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    color:#111;
}

/* HEADER */

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:65px;

    background:white;

    display:flex;
    align-items:center;
    gap:25px;

    padding:0 20px;

    box-shadow:0 2px 8px rgba(0,0,0,.12);

    z-index:1000;
}

.logo{
    color:red;
    font-size:27px;
    font-weight:bold;
}

.search{
    flex:1;
    max-width:650px;
    display:flex;
}

.search input{
    flex:1;

    height:42px;

    padding:0 15px;

    border:1px solid #ccc;
    border-radius:22px 0 0 22px;

    outline:none;

    font-size:15px;
}

.search button{
    width:60px;

    border:none;

    background:#eee;

    border-radius:0 22px 22px 0;

    cursor:pointer;

    font-size:18px;
}

.search button:hover{
    background:#ddd;
}


/* SIDEBAR */

.sidebar{
    position:fixed;

    top:65px;
    left:0;

    width:210px;
    height:calc(100vh - 65px);

    background:white;

    padding:15px 10px;

    border-right:1px solid #ddd;
}

.sidebar button{
    width:100%;

    border:none;
    background:white;

    text-align:left;

    padding:13px 15px;

    border-radius:8px;

    font-size:15px;

    cursor:pointer;
}

.sidebar button:hover{
    background:#eee;
}


/* CONTENT */

main{
    margin-left:210px;

    padding:90px 25px 30px;
}


/* PLAYER */

.player{
    width:100%;
    max-width:1000px;

    margin:0 auto 30px;

    background:black;

    display:none;
}

.player iframe{
    width:100%;

    aspect-ratio:16/9;

    border:0;

    display:block;
}


/* SEARCH RESULTS */

.results{
    width:100%;
    max-width:1100px;

    margin:auto;

    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(280px,1fr));

    gap:22px;
}

.video-card{
    background:white;

    border-radius:10px;

    overflow:hidden;

    cursor:pointer;

    box-shadow:0 2px 8px rgba(0,0,0,.12);

    transition:.2s;
}

.video-card:hover{
    transform:translateY(-3px);

    box-shadow:0 5px 15px rgba(0,0,0,.18);
}

.thumbnail{
    width:100%;

    aspect-ratio:16/9;

    object-fit:cover;

    display:block;
}

.video-info{
    padding:12px;
}

.video-title{
    font-size:16px;

    font-weight:bold;

    line-height:1.4;

    display:-webkit-box;

    -webkit-line-clamp:2;

    -webkit-box-orient:vertical;

    overflow:hidden;
}

.channel{
    color:#666;

    font-size:13px;

    margin-top:8px;
}


/* MESSAGE */

.message{
    text-align:center;

    color:#666;

    padding:50px 10px;

    font-size:16px;
}


/* MOBILE */

@media(max-width:700px){

    header{
        height:115px;

        padding:10px 12px;

        display:flex;

        flex-wrap:wrap;

        gap:8px;
    }

    .logo{
        font-size:23px;
    }

    .search{
        width:100%;
        max-width:none;
    }

    .sidebar{
        top:115px;

        width:100%;
        height:48px;

        padding:4px 7px;

        display:flex;

        overflow-x:auto;

        border-right:none;

        border-bottom:1px solid #ddd;
    }

    .sidebar button{
        width:auto;

        white-space:nowrap;

        padding:8px 13px;

        font-size:13px;
    }

    main{
        margin-left:0;

        padding:175px 10px 25px;
    }

    .results{
        grid-template-columns:1fr;

        gap:16px;
    }

    .video-card{
        border-radius:8px;
    }

    .player{
        margin-bottom:20px;
    }

}


/* SMALL MOBILE */

@media(max-width:380px){

    main{
        padding-left:6px;
        padding-right:6px;
    }

    .search input{
        font-size:14px;
    }

}

</style>
</head>


<body>


<!-- HEADER -->

<header>

    <div class="logo">
        MyTube
    </div>

    <div class="search">

        <input
            id="searchInput"
            type="text"
            placeholder="Search YouTube..."
        >

        <button onclick="searchYouTube()">
            🔍
        </button>

    </div>

</header>



<!-- SIDEBAR -->

<div class="sidebar">

    <button onclick="home()">
        🏠 Home
    </button>

    <button onclick="searchTrending()">
        🔥 Trending
    </button>

    <button onclick="showMessage('Subscriptions')">
        📺 Subscriptions
    </button>

    <button onclick="showMessage('Library')">
        📚 Library
    </button>

</div>



<!-- MAIN -->

<main>


    <!-- VIDEO PLAYER -->

    <div class="player" id="player">

        <iframe
            id="youtubePlayer"
            allow="autoplay; encrypted-media; picture-in-picture"
            allowfullscreen>
        </iframe>

    </div>



    <!-- RESULTS -->

    <div
        class="results"
        id="results">
    </div>


    <div
        class="message"
        id="message">

        Search for a YouTube video above.

    </div>


</main>



<script>

/*
==================================================
IMPORTANT
==================================================

এখানে তোমার YouTube Data API v3 key বসাও।

Example:

const API_KEY = "AIzaSyXXXXXXXXXXXXXXXXXXXX";

==================================================
*/

const API_KEY = "AlzaSyC277sdi6zQKQiEIZLj0Es_ZyOba1pzy3c";


/* SEARCH YOUTUBE */

async function searchYouTube(){

    const query =
        document.getElementById("searchInput").value.trim();

    if(!query){
        return;
    }

    const results =
        document.getElementById("results");

    const message =
        document.getElementById("message");

    const player =
        document.getElementById("player");

    player.style.display = "none";

    results.innerHTML = "";

    message.style.display = "block";

    message.innerText = "Searching YouTube...";


    try{

        const url =
        "https://www.googleapis.com/youtube/v3/search" +

        "?part=snippet" +

        "&type=video" +

        "&maxResults=24" +

        "&q=" +
        encodeURIComponent(query) +

        "&key=" +
        API_KEY;


        const response =
            await fetch(url);


        const data =
            await response.json();


        if(data.error){

            message.innerText =
                "YouTube API error: " +
                data.error.message;

            return;
        }


        results.innerHTML = "";

        message.style.display = "none";


        data.items.forEach(item => {

            const videoId =
                item.id.videoId;

            const title =
                item.snippet.title;

            const channel =
                item.snippet.channelTitle;

            const thumbnail =
                item.snippet.thumbnails.medium.url;


            const card =
                document.createElement("div");

            card.className =
                "video-card";


            card.innerHTML = `

                <img
                    class="thumbnail"
                    src="${thumbnail}"
                    alt=""
                >

                <div class="video-info">

                    <div class="video-title">
                        ${escapeHTML(title)}
                    </div>

                    <div class="channel">
                        ${escapeHTML(channel)}
                    </div>

                </div>

            `;


            card.onclick =
                function(){

                    playVideo(videoId);

                };


            results.appendChild(card);

        });


    }catch(error){

        message.style.display = "block";

        message.innerText =
            "Something went wrong.";

        console.error(error);

    }

}



/* PLAY VIDEO */

function playVideo(videoId){

    const player =
        document.getElementById("player");

    const iframe =
        document.getElementById("youtubePlayer");


    iframe.src =
        "https://www.youtube.com/embed/" +
        videoId +
        "?autoplay=1";


    player.style.display =
        "block";


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}



/* ENTER KEY SEARCH */

document
.getElementById("searchInput")
.addEventListener("keydown",function(event){

    if(event.key === "Enter"){

        searchYouTube();

    }

});



/* HOME */

function home(){

    document
    .getElementById("player")
    .style.display = "none";

    document
    .getElementById("results")
    .innerHTML = "";

    const message =
        document.getElementById("message");

    message.style.display = "block";

    message.innerText =
        "Search for a YouTube video above.";

}



/* TRENDING */

function searchTrending(){

    document
    .getElementById("searchInput")
    .value = "trending";

    searchYouTube();

}



/* OTHER MENU */

function showMessage(name){

    document
    .getElementById("player")
    .style.display = "none";

    document
    .getElementById("results")
    .innerHTML = "";

    const message =
        document.getElementById("message");

    message.style.display = "block";

    message.innerText =
        name + " is not connected yet.";

}



/* SECURITY */

function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}

</script>


</body>
</html>
