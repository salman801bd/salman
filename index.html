<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>SALMAN</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

:root{
    --bg:#f5f7fb;
    --card:#fff;
    --text:#111;
    --muted:#777;
    --border:#ddd;
    --primary:#111;
}

body.dark{
    --bg:#151515;
    --card:#222;
    --text:#fff;
    --muted:#aaa;
    --border:#444;
    --primary:#fff;
}

body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    transition:.2s;
}


/* ================= HEADER ================= */

header{
    height:65px;
    position:fixed;
    top:0;
    left:0;
    right:0;
    background:var(--card);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    z-index:1000;
}

.logo{
    font-size:23px;
    font-weight:bold;
}

.header-right{
    display:flex;
    gap:8px;
}

.icon-btn{
    width:40px;
    height:40px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    border-radius:9px;
    cursor:pointer;
    font-size:18px;
}


/* ================= SIDEBAR ================= */

.sidebar{
    position:fixed;
    top:65px;
    left:0;
    width:220px;
    height:calc(100vh - 65px);
    background:var(--card);
    border-right:1px solid var(--border);
    padding:15px;
    z-index:900;
}

.nav{
    width:100%;
    border:0;
    background:transparent;
    color:var(--text);
    text-align:left;
    padding:12px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    margin-bottom:4px;
}

.nav:hover,
.nav.active{
    background:var(--bg);
}


/* ================= MAIN ================= */

main{
    margin-left:220px;
    padding:90px 25px 30px;
    max-width:1350px;
}

.page-title{
    margin-bottom:20px;
}

.page-title h1{
    font-size:28px;
}

.page-title p{
    color:var(--muted);
    margin-top:5px;
}


/* ================= GRID ================= */

.grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:18px;
}


/* ================= CARD ================= */

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px;
    box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.card h2{
    font-size:18px;
    margin-bottom:15px;
}


/* ================= CLOCK ================= */

.clock{
    font-size:38px;
    font-weight:bold;
}

.date{
    color:var(--muted);
    margin-top:5px;
}


/* ================= IP LOCATION ================= */

.ip-info{
    font-size:15px;
    line-height:1.8;
}

.ip-info b{
    color:var(--text);
}


/* ================= WORLD TIME ================= */

.world-search{
    position:relative;
    margin-bottom:12px;
}

.world-search input{
    width:100%;
    padding:11px 13px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    border-radius:9px;
    outline:none;
}

.country-list{
    max-height:180px;
    overflow-y:auto;
    border:1px solid var(--border);
    border-radius:9px;
    background:var(--card);
    display:none;
}

.country-option{
    padding:10px 12px;
    cursor:pointer;
    border-bottom:1px solid var(--border);
    font-size:14px;
}

.country-option:last-child{
    border-bottom:0;
}

.country-option:hover{
    background:var(--bg);
}

.selected-country{
    display:none;
    margin-top:12px;
    padding:15px;
    border-radius:10px;
    background:var(--bg);
    border:1px solid var(--border);
}

.country-name{
    font-size:20px;
    font-weight:bold;
    margin-bottom:8px;
}

.country-info{
    color:var(--muted);
    font-size:14px;
    line-height:1.8;
}

.country-time{
    margin-top:10px;
    font-size:28px;
    font-weight:bold;
}


/* ================= NOTES ================= */

textarea{
    width:100%;
    min-height:180px;
    resize:vertical;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    border-radius:8px;
    padding:11px;
    outline:none;
}


/* ================= TODO ================= */

.todo-input{
    display:flex;
    gap:8px;
}

input{
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    border-radius:8px;
    padding:11px;
    outline:none;
}

.todo-input input{
    width:100%;
}

.primary{
    border:0;
    background:var(--primary);
    color:var(--bg);
    border-radius:8px;
    padding:0 15px;
    cursor:pointer;
    font-weight:bold;
}

.todo-list{
    margin-top:15px;
}

.todo{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--border);
}

.todo span{
    flex:1;
}

.todo.done span{
    text-decoration:line-through;
    color:var(--muted);
}

.delete{
    border:0;
    background:none;
    color:#e33;
    cursor:pointer;
    font-size:16px;
}


/* ================= CALCULATOR ================= */

.calculator{
    max-width:350px;
}

.calc-display{
    width:100%;
    height:55px;
    margin-bottom:10px;
    text-align:right;
    font-size:25px;
}

.calc-buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
}

.calc-buttons button{
    height:48px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

.calc-buttons button:hover{
    opacity:.7;
}


/* ================= TIMER ================= */

.timer{
    font-size:45px;
    font-weight:bold;
    text-align:center;
    padding:15px;
}

.timer-controls{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
}

.timer-controls button{
    padding:10px 15px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    border-radius:8px;
    cursor:pointer;
}


/* ================= SEARCH ================= */

.search-box{
    display:flex;
    gap:8px;
}

.search-box input{
    width:100%;
}

.search-box button{
    height:42px;
}


/* ================= MOBILE ================= */

@media(max-width:800px){

    .sidebar{
        width:100%;
        height:55px;
        top:65px;
        display:flex;
        overflow-x:auto;
        padding:6px;
        border-right:0;
        border-bottom:1px solid var(--border);
    }

    .nav{
        width:auto;
        white-space:nowrap;
        padding:9px 12px;
        margin:0;
    }

    main{
        margin-left:0;
        padding:135px 12px 25px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .page-title h1{
        font-size:24px;
    }

    .clock{
        font-size:30px;
    }

    .country-time{
        font-size:25px;
    }

}

@media(max-width:400px){

    header{
        padding:0 12px;
    }

    .logo{
        font-size:20px;
    }

    .card{
        padding:14px;
    }

}

</style>
</head>


<body>


<!-- ================= HEADER ================= -->

<header>

    <div class="logo">
        SALMAN
    </div>

    <div class="header-right">

            class="icon-btn"
            onclick="toggleDark()"
            id="themeBtn">
            🌙
        </button>

    </div>

</header>



<!-- ================= SIDEBAR ================= -->

<nav class="sidebar">

    <button
        class="nav active"
        onclick="showAll()">
        🏠 Dashboard
    </button>

    <button
        class="nav"
        onclick="focusSection('ipLocation')">
        📍 IP Location
    </button>

    <button
        class="nav"
        onclick="focusSection('worldTime')">
        🌎 World Time
    </button>

    <button
        class="nav"
        onclick="focusSection('notes')">
        📝 Notes
    </button>

        class="nav"
        onclick="focusSection('todo')">
        ✅ Tasks
    </button>

    <button
        class="nav"
        onclick="focusSection('calculator')">
        🧮 Calculator
    </button>

    <button
        class="nav"
        onclick="focusSection('timer')">
        ⏱️ Timer
    </button>

    <button
        class="nav"
        onclick="focusSection('search')">
        🔎 Search
    </button>

</nav>



<!-- ================= MAIN ================= -->

<main>


<div class="page-title">

    <h1>
        SALMAN
    </h1>

    <p>
        Your personal all-in-one utility dashboard.
    </p>

</div>



<div class="grid">


<!-- ================= LOCAL CLOCK ================= -->

<section class="card">

    <h2 id="localTitle">🕐 Local Time</h2>

    <div
        class="clock"
        id="clock">
        12:00:00 AM
    </div>

    <div
        class="date"
        id="date">
    </div>

</section>



<!-- ================= IP LOCATION ================= -->

<section
    class="card"
    id="ipLocation">

    <h2>📍 My IP & Location</h2>

    <div class="ip-info" id="ipInfoBox">
        Fetching location info...
    </div>

</section>



<!-- ================= WORLD TIME ================= -->

<section
    class="card"
    id="worldTime">

    <h2>🌎 World Time (All Countries & All Zones)</h2>

    <div class="world-search">

        <input
            id="countrySearch"
            placeholder="Search any country, zone, or capital..."
            autocomplete="off"
            oninput="filterCountries()"
            onclick="openCountryList()">

    </div>


    <div
        class="country-list"
        id="countryList">
    </div>


    <div
        class="selected-country"
        id="selectedCountry">

        <div
            class="country-name"
            id="countryName">
        </div>

        <div
            class="country-info"
            id="countryInfo">
        </div>

        <div
            class="country-time"
            id="countryTime">
        </div>

    </div>

</section>



<!-- ================= NOTES ================= -->

<section
    class="card"
    id="notes">

    <h2>📝 Notes</h2>

    <textarea
        id="notesBox"
        placeholder="Write your notes here...">
    </textarea>

</section>



<!-- ================= TODO ================= -->

<section
    class="card"
    id="todo">

    <h2>✅ To-Do List</h2>

    <div class="todo-input">

        <input
            id="todoInput"
            placeholder="Add a task..."
            onkeydown="todoEnter(event)">

        <button
            class="primary"
            onclick="addTodo()">
            Add
        </button>

    </div>

    <div
        class="todo-list"
        id="todoList">
    </div>

</section>



<!-- ================= CALCULATOR ================= -->

<section
    class="card calculator"
    id="calculator">

    <h2>🧮 Calculator</h2>

    <input
        class="calc-display"
        id="calcDisplay"
        readonly>

    <div class="calc-buttons">

        <button onclick="clearCalc()">C</button>
        <button onclick="backCalc()">⌫</button>
        <button onclick="addCalc('%')">%</button>
        <button onclick="addCalc('/')">÷</button>

        <button onclick="addCalc('7')">7</button>
        <button onclick="addCalc('8')">8</button>
        <button onclick="addCalc('9')">9</button>
        <button onclick="addCalc('*')">×</button>

        <button onclick="addCalc('4')">4</button>
        <button onclick="addCalc('5')">5</button>
        <button onclick="addCalc('6')">6</button>
        <button onclick="addCalc('-')">−</button>

        <button onclick="addCalc('1')">1</button>
        <button onclick="addCalc('2')">2</button>
        <button onclick="addCalc('3')">3</button>
        <button onclick="addCalc('+')">+</button>

        <button onclick="addCalc('0')">0</button>
        <button onclick="addCalc('.')">.</button>
        <button onclick="calculate()">=</button>

    </div>

</section>



<!-- ================= TIMER ================= -->

<section
    class="card"
    id="timer">

    <h2>⏱️ 5-Minute Timer</h2>

    <div
        class="timer"
        id="timerDisplay">
        05:00
    </div>

    <div class="timer-controls">

        <button onclick="startTimer()">
            ▶ Start
        </button>

        <button onclick="pauseTimer()">
            ⏸ Pause
        </button>

        <button onclick="resetTimer()">
            ↻ Reset
        </button>

    </div>

</section>



<!-- ================= GOOGLE SEARCH ================= -->

<section
    class="card"
    id="search">

    <h2>🔎 Quick Search</h2>

    <div class="search-box">

        <input
            id="googleInput"
            placeholder="Search Google..."
            onkeydown="googleEnter(event)">

        <button
            class="primary"
            onclick="googleSearch()">
            Search
        </button>

    </div>

</section>


</div>

</main>

/* ==================================================
   AUTO-DETECTED LOCAL CLOCK & LOCATION (VPN FRIENDLY)
================================================== */

let userTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
let userLocationName = "Local Time";

async function detectLocationByIP() {
    try {
        const response = await fetch('https://ipapi.co/json/');
        const data = await response.json();
        
        if (data && data.timezone) {
            userTimeZone = data.timezone;
            if (data.country_name) {
                userLocationName = `${data.country_name} (${data.city || ''})`;
            }
        }
        
        // Display details in the new My IP Location card
        if(data) {
            document.getElementById("ipInfoBox").innerHTML = `
                IP Address: <b>${escapeHTML(data.ip || 'N/A')}</b><br>
                Country: <b>${escapeHTML(data.country_name || 'N/A')} (${escapeHTML(data.country_code || '')})</b><br>
                City / Region: <b>${escapeHTML(data.city || 'N/A')} - ${escapeHTML(data.region || '')}</b><br>
                ISP / Org: <b>${escapeHTML(data.org || 'N/A')}</b><br>
                Timezone: <b>${escapeHTML(data.timezone || userTimeZone)}</b>
            `;
        }
    } catch (error) {
        console.log("IP detection fallback.");
        document.getElementById("ipInfoBox").innerHTML = `
            Timezone: <b>${escapeHTML(userTimeZone)}</b><br>
            <span style="color:var(--muted);">IP details unavailable offline or blocked by extension.</span>
        `;
    }
}

function updateClock(){
    const now = new Date();

    const timeString = new Intl.DateTimeFormat(
        undefined,
        {
            timeZone: userTimeZone,
            hour: "numeric",
            minute: "2-digit",
            second: "2-digit",
            hour12: true
        }
    ).format(now);

    const dateString = new Intl.DateTimeFormat(
        undefined,
        {
            timeZone: userTimeZone,
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric"
        }
    ).format(now);

    document.getElementById("clock").textContent = timeString;
    document.getElementById("date").textContent = dateString;
    
    document.getElementById("localTitle").innerHTML = `🕐 Local Time — ${userLocationName}`;
}

detectLocationByIP().then(() => {
    updateClock();
});

setInterval(updateClock, 1000);



/* ==================================================
   WORLD TIME SEARCH
================================================== */

const countrySearch = document.getElementById("countrySearch");
const countryList = document.getElementById("countryList");


function openCountryList(){
    filterCountries();
    countryList.style.display = "block";
}


function filterCountries(){

    const query = countrySearch.value.toLowerCase().trim();

    const filtered = countries.filter(function(item){
        return (
            item.name.toLowerCase().includes(query) ||
            item.official.toLowerCase().includes(query) ||
            item.code.toLowerCase().includes(query) ||
            item.capital.toLowerCase().includes(query) ||
            item.continent.toLowerCase().includes(query) ||
            item.tz.toLowerCase().includes(query)
        );
    });

    countryList.innerHTML = "";

    filtered.forEach(function(item){

        const option = document.createElement("div");
        option.className = "country-option";

        option.innerHTML = "🌎 <b>" + escapeHTML(item.name) + "</b> [" + escapeHTML(item.code) + "] — " + escapeHTML(item.capital) + " <small style='color:var(--muted);'>(" + escapeHTML(item.official) + ")</small>";

        option.onclick = function(){
            selectCountry(item);
        };

        countryList.appendChild(option);

    });

    countryList.style.display = filtered.length ? "block" : "none";

}


let activeWorldInterval = null;

function selectCountry(item){

    countrySearch.value = item.name + " [" + item.code + "]";
    countryList.style.display = "none";

    document.getElementById("selectedCountry").style.display = "block";
    
    document.getElementById("countryName").textContent = "🌎 " + item.official + " (" + item.code + ")";

    if(activeWorldInterval) clearInterval(activeWorldInterval);

    updateWorldTime(item);

    activeWorldInterval = setInterval(function(){
        updateWorldTime(item);
    }, 1000);

}


function updateWorldTime(item){

    const now = new Date();

    const time = new Intl.DateTimeFormat(
        "en-US",
        {
            timeZone: item.tz,
            hour: "numeric",
            minute: "2-digit",
            second: "2-digit",
            hour12: true
        }
    ).format(now);

    const date = new Intl.DateTimeFormat(
        "en-US",
        {
            timeZone: item.tz,
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric"
        }
    ).format(now);

    const offset = getGMTOffset(now, item.tz);

    document.getElementById("countryInfo").innerHTML =
        "Common Name: <b>" + escapeHTML(item.name) + "</b><br>" +
        "Country Code: <b>[" + escapeHTML(item.code) + "]</b><br>" +
        "Capital / Region: <b>" + escapeHTML(item.capital) + "</b><br>" +
        "Continent: <b>" + escapeHTML(item.continent) + "</b><br>" +
        "Timezone ID: <b>" + escapeHTML(item.tz) + "</b><br>" +
        "GMT Offset: <b>" + offset + "</b><br>" +
        "Date: <b>" + date + "</b>";

    document.getElementById("countryTime").textContent = time;

}


function getGMTOffset(date, tz){
    const parts = new Intl.DateTimeFormat("en-US", {
        timeZone: tz,
        timeZoneName: "longOffset"
    }).formatToParts(date);

    const part = parts.find(p => p.type === "timeZoneName");
    if(!part) return "GMT";
    return part.value;
}

/* ==================================================
   TODO
================================================== */

let todos = JSON.parse(localStorage.getItem("salmanTodos") || "[]");

function saveTodos(){
    localStorage.setItem("salmanTodos", JSON.stringify(todos));
}

function renderTodos(){
    const list = document.getElementById("todoList");
    list.innerHTML = "";

    todos.objects.forEach ? null : todos.forEach(function(todo, index){});

    todos.forEach(function(todo, index){
        const div = document.createElement("div");
        div.className = "todo" + (todo.done ? " done" : "");

        div.innerHTML = `
            <input type="checkbox" ${todo.done ? "checked" : ""} onchange="toggleTodo(${index})">
            <span>${escapeHTML(todo.text)}</span>
            <button class="delete" onclick="deleteTodo(${index})">✕</button>
        `;
        list.appendChild(div);
    });
}

function addTodo(){
    const input = document.getElementById("todoInput");
    const text = input.value.trim();
    if(!text) return;

    todos.push({ text: text, done: false });
    input.value = "";
    saveTodos();
    renderTodos();
}

function todoEnter(event){
    if(event.key === "Enter") addTodo();
}

function toggleTodo(index){
    todos[index].done = !todos[index].done;
    saveTodos();
    renderTodos();
}

function deleteTodo(index){
    todos.splice(index, 1);
    saveTodos();
    renderTodos();
}

renderTodos();



/* ==================================================
   CALCULATOR
================================================== */

function addCalc(value){
    document.getElementById("calcDisplay").value += value;
}

function clearCalc(){
    document.getElementById("calcDisplay").value = "";
}

function backCalc(){
    const display = document.getElementById("calcDisplay");
    display.value = display.value.slice(0, -1);
}

function calculate(){
    const display = document.getElementById("calcDisplay");
    try{
        const expression = display.value;
        if(!/^[0-9+\-*/%.() ]+$/.test(expression)) throw new Error();
        display.value = Function('"use strict";return (' + expression + ')')();
    }catch{
        display.value = "Error";
    }
}



/* ==================================================
   TIMER
================================================== */

let timeLeft = 300;
let timer = null;

function updateTimer(){
    const minutes = Math.floor(timeLeft / 60).toString().padStart(2, "0");
    const seconds = (timeLeft % 60).toString().padStart(2, "0");
    document.getElementById("timerDisplay").textContent = minutes + ":" + seconds;
}

function startTimer(){
    if(timer) return;
    timer = setInterval(function(){
        if(timeLeft <= 0){
            clearInterval(timer);
            timer = null;
            alert("⏰ Time's up!");
            return;
        }
        timeLeft--;
        updateTimer();
    }, 1000);
}

function pauseTimer(){
    clearInterval(timer);
    timer = null;
}

function resetTimer(){
    clearInterval(timer);
    timer = null;
    timeLeft = 300;
    updateTimer();
}

updateTimer();
