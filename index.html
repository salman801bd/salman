<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyTube</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}
body{
    background:#f9f9f9;
}
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 20px;
    background:#fff;
    position:fixed;
    top:0;
    width:100%;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}
.logo{
    color:red;
    font-size:28px;
    font-weight:bold;
}
.search input{
    width:400px;
    padding:8px;
}
.sidebar{
    width:200px;
    position:fixed;
    top:60px;
    left:0;
    height:100%;
    background:#fff;
    padding:20px;
}
.sidebar a{
    display:block;
    text-decoration:none;
    color:#000;
    padding:10px 0;
}
.content{
    margin-left:220px;
    margin-top:80px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:20px;
}
.video{
    background:#fff;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 2px 5px rgba(0,0,0,.2);
}
.video img{
    width:100%;
}
.video h3{
    padding:10px;
}
</style>

</head>
<body>

<header>
    <div class="logo">MyTube</div>
    <div class="search">
        <input type="text" placeholder="Search">
    </div>
</header>

<div class="sidebar">
    <a href="#">🏠 Home</a>
    <a href="#">🔥 Trending</a>
    <a href="#">📺 Subscriptions</a>
    <a href="#">📚 Library</a>
</div>

<div class="content">

<div class="video">
<img src="https://via.placeholder.com/400x220" alt="">
<h3>Video Title 1</h3>
</div>

<div class="video">
<img src="https://via.placeholder.com/400x220" alt="">
<h3>Video Title 2</h3>
</div>

<div class="video">
<img src="https://via.placeholder.com/400x220" alt="">
<h3>Video Title 3</h3>
</div>

<div class="video">
<img src="https://via.placeholder.com/400x220" alt="">
<h3>Video Title 4</h3>
</div>

</div>

</body>
</html>
