<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>MyAI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#fff;
    color:#111;
    height:100vh;
    overflow:hidden;
}

/* SIDEBAR */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:260px;
    height:100vh;
    background:#f7f7f8;
    padding:12px;
    border-right:1px solid #ddd;
    z-index:1000;
}

.new-chat{
    width:100%;
    padding:12px;
    background:#fff;
    border:1px solid #ddd;
    border-radius:8px;
    cursor:pointer;
    text-align:left;
    font-size:14px;
}

.new-chat:hover{
    background:#eee;
}

/* MAIN */

.main{
    margin-left:260px;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* HEADER */

.header{
    height:60px;
    display:flex;
    align-items:center;
    padding:0 20px;
    border-bottom:1px solid #eee;
}

.menu{
    display:none;
    border:none;
    background:none;
    font-size:24px;
    cursor:pointer;
}

.logo{
    font-size:20px;
    font-weight:bold;
}

/* CHAT */

.chat-container{
    flex:1;
    overflow-y:auto;
    padding:30px 20px 150px;
}

.chat{
    max-width:850px;
    margin:auto;
}

.welcome{
    text-align:center;
    margin-top:18vh;
}

.welcome h1{
    font-size:32px;
    margin-bottom:10px;
}

.welcome p{
    color:#777;
}

.message{
    display:flex;
    gap:14px;
    margin-bottom:28px;
    line-height:1.6;
}

.avatar{
    width:32px;
    height:32px;
    min-width:32px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#111;
    color:#fff;
    font-size:11px;
}

.user{
    background:#ddd;
    color:#111;
}

.text{
    flex:1;
    white-space:pre-wrap;
    word-break:break-word;
}

/* INPUT */

.input-area{
    position:fixed;
    left:260px;
    right:0;
    bottom:0;
    padding:30px 20px 15px;
    background:linear-gradient(transparent,#fff 30%);
}

.input-box{
    max-width:850px;
    margin:auto;
    display:flex;
    align-items:flex-end;
    background:white;
    border:1px solid #ccc;
    border-radius:18px;
    padding:8px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

textarea{
    flex:1;
    border:none;
    outline:none;
    resize:none;
    padding:10px;
    font-size:15px;
    max-height:140px;
}

.send{
    width:40px;
    height:40px;
    border:none;
    border-radius:50%;
    background:#111;
    color:white;
    cursor:pointer;
    font-size:18px;
}

.send:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.note{
    text-align:center;
    font-size:11px;
    color:#888;
    margin-top:7px;
}

/* MOBILE */

@media(max-width:700px){

    .sidebar{
        transform:translateX(-100%);
        transition:.2s;
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .main{
        margin-left:0;
    }

    .header{
        height:58px;
        gap:12px;
    }

    .menu{
        display:block;
    }

    .input-area{
        left:0;
        padding:25px 10px 12px;
    }

    .chat-container{
        padding:20px 12px 145px;
    }

    .welcome h1{
        font-size:25px;
    }

    .message{
        font-size:14px;
    }
}
</style>
</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar" id="sidebar">

    <button class="new-chat" onclick="newChat()">
        ＋ New chat
    </button>

</div>


<!-- MAIN -->

<div class="main">

    <header class="header">

        <button class="menu" onclick="toggleMenu()">
            ☰
        </button>

        <div class="logo">
            MyAI
        </div>

    </header>


    <div class="chat-container" id="container">

        <div class="welcome" id="welcome">

            <h1>
                How can I help you?
            </h1>

            <p>
                Ask me anything.
            </p>

        </div>

        <div class="chat" id="chat"></div>

    </div>


    <div class="input-area">

        <div class="input-box">

            <textarea
                id="input"
                rows="1"
                placeholder="Message MyAI..."
                onkeydown="keyDown(event)">
            </textarea>

            <button
                class="send"
                id="send"
                onclick="sendMessage()">

                ↑

            </button>

        </div>

        <div class="note">
            MyAI may make mistakes. Check important information.
        </div>

    </div>

</div>


<script>

/*
==================================================
PUT YOUR API KEY HERE
==================================================

IMPORTANT:
This single-file method exposes your API key
to anyone who opens the website.

For testing only.

==================================================
*/

const API_KEY = "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";


/*
==================================================
AI MODEL
==================================================
*/

const MODEL = "gpt-4o-mini";


/*
==================================================
CHAT MEMORY
==================================================
*/

let messages = [];


/*
==================================================
SEND MESSAGE
==================================================
*/

async function sendMessage(){

    const input =
        document.getElementById("input");

    const send =
        document.getElementById("send");

    const text =
        input.value.trim();

    if(!text || send.disabled){
        return;
    }


    document
    .getElementById("welcome")
    .style.display="none";


    addMessage(
        "You",
        text,
        true
    );


    messages.push({
        role:"user",
        content:text
    });


    input.value="";

    send.disabled=true;


    const loading =
        addMessage(
            "AI",
            "Thinking...",
            false
        );


    try{

        const response =
        await fetch(
            "https://api.openai.com/v1/chat/completions",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json",

                    "Authorization":
                        "Bearer " + API_KEY
                },

                body:JSON.stringify({

                    model:MODEL,

                    messages:messages,

                    temperature:0.7

                })
            }
        );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error?.message ||
                "API request failed"
            );

        }


        const answer =
            data.choices[0]
            .message
            .content;


        loading.textContent =
            answer;


        messages.push({

            role:"assistant",

            content:answer

        });


    }catch(error){

        loading.textContent =
            "Error: " + error.message;

        console.error(error);

    }


    send.disabled=false;


    scrollBottom();

}


/*
==================================================
ADD MESSAGE
==================================================
*/

function addMessage(
    name,
    text,
    isUser
){

    const chat =
        document.getElementById("chat");


    const message =
        document.createElement("div");

    message.className="message";


    const avatar =
        document.createElement("div");

    avatar.className =
        isUser
        ? "avatar user"
        : "avatar";


    avatar.textContent =
        isUser ? "You" : "AI";


    const content =
        document.createElement("div");

    content.className="text";

    content.textContent=text;


    message.appendChild(avatar);

    message.appendChild(content);

    chat.appendChild(message);


    scrollBottom();


    return content;

}


/*
==================================================
ENTER KEY
==================================================
*/

function keyDown(event){

    if(
        event.key==="Enter" &&
        !event.shiftKey
    ){

        event.preventDefault();

        sendMessage();

    }

}


/*
==================================================
NEW CHAT
==================================================
*/

function newChat(){

    messages=[];

    document
    .getElementById("chat")
    .innerHTML="";


    document
    .getElementById("welcome")
    .style.display="block";


    document
    .getElementById("input")
    .value="";


    closeMenu();

}


/*
==================================================
SCROLL
==================================================
*/

function scrollBottom(){

    const container =
        document.getElementById("container");

    container.scrollTo({

        top:container.scrollHeight,

        behavior:"smooth"

    });

}


/*
==================================================
MOBILE MENU
==================================================
*/

function toggleMenu(){

    document
    .getElementById("sidebar")
    .classList.toggle("open");

}


function closeMenu(){

    document
    .getElementById("sidebar")
    .classList.remove("open");

}

</script>

</body>
</html>
